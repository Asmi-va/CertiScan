<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Institution Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9fafb;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
        }
        h1 {
            margin: 0;
        }
        main {
            max-width: 900px;
            margin: 20px auto;
        }
        .status {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Institution Portal</h1>
    </header>
    <main>
        <div id="status" class="status">Loading institution data...</div>
        <div id="error" class="error" style="display:none;"></div>
        <div>
            <h2>Manage Certificates</h2>
            <p>Functionality to manage and verify certificates will be implemented here.</p>
        </div>
    </main>
    <script>
        async function fetchInstitutionData() {
            try {
                // Example API call to fetch institution list
                const response = await fetch('http://localhost:8002/api/institutions/');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                document.getElementById('status').textContent = 'Institutions loaded: ' + data.institutions.length;
            } catch (error) {
                document.getElementById('status').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Error fetching institution data: ' + error.message;
            }
        }
        fetchInstitutionData();
    </script>
</body>
</html>
