<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Government Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9fafb;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #004085;
            color: white;
            padding: 15px;
            text-align: center;
        }
        h1 {
            margin: 0;
        }
        main {
            max-width: 900px;
            margin: 20px auto;
        }
        .status {
            background: #d1ecf1;
            color: #0c5460;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Government Dashboard</h1>
    </header>
    <main>
        <div id="status" class="status">Loading system status...</div>
        <div id="error" class="error" style="display:none;"></div>
        <div>
            <h2>Certificate Verification Statistics</h2>
            <p>Data will be displayed here.</p>
        </div>
    </main>
    <script>
        async function fetchSystemStatus() {
            try {
                const response = await fetch('http://localhost:8002/api/verification/system-status');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                document.getElementById('status').textContent = 'System Status: ' + (data.status || 'Unknown');
            } catch (error) {
                document.getElementById('status').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Error fetching system status: ' + error.message;
            }
        }
        fetchSystemStatus();
    </script>
</body>
</html>
